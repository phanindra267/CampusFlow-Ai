  <rect width="1180" height="720" fill="url(#bg2)"/>
  <text x="590" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">CampusCare AI — Core Domain Model (ER Diagram)</text>
  <text x="590" y="54" text-anchor="middle" font-size="11.5" fill="#64748b">48 active tables · community &amp; campus-life scope · no grades, marks or attendance-for-grading</text>

  <!-- LEGEND -->
