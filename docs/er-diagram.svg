<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-size:12px; font-weight:700; fill:#0f172a; }
      .f { font-size:10px; fill:#475569; }
      .pk { fill:#b45309; font-weight:700; }
      .fk { fill:#1d4ed8; font-weight:700; }
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.4; rx:8; }
      .lbl { font-size:9.5px; fill:#94a3b8; font-style:italic; }
