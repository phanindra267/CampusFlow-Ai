<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .lane { font-size:12px; font-weight:700; fill:#0f172a; letter-spacing:0.6px; }
      .card { font-size:11px; font-weight:700; fill:#1e293b; }
      .det { font-size:9.5px; fill:#64748b; }
      .ttl { font-size:19px; font-weight:700; fill:#0f172a; }
    </style>
  </defs>

  <rect width="1180" height="560" fill="url(#bg5)"/>
  <text x="590" y="34" text-anchor="middle" class="ttl">User Journeys &amp; Product Surfaces</text>
  <text x="590" y="54" text-anchor="middle" class="det">Ten member-facing routes plus four role-gated admin consoles, backed by 117 REST endpoints</text>

  <!-- MEMBER JOURNEY -->
  <rect x="30" y="76" width="1120" height="180" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="98" class="lane" fill="#c2410c">MEMBER JOURNEY — the daily loop</text>

  <!-- steps -->
  <g>
    <rect x="48" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="113" y="130" text-anchor="middle" class="card">/login</text>
    <text x="113" y="146" text-anchor="middle" class="det">email + password</text>
    <text x="113" y="160" text-anchor="middle" class="det">Google OAuth</text>
    <text x="113" y="172" text-anchor="middle" class="det">OTP request/verify</text>
  </g>
  <line x1="180" y1="143" x2="200" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="202" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="267" y="130" text-anchor="middle" class="card">/dashboard</text>
    <text x="267" y="146" text-anchor="middle" class="det">time-aware greeting</text>
    <text x="267" y="160" text-anchor="middle" class="det">3 stat tiles</text>
    <text x="267" y="172" text-anchor="middle" class="det">"what's happening"</text>
  </g>
  <line x1="334" y1="143" x2="354" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="356" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="421" y="130" text-anchor="middle" class="card">/discover</text>
    <text x="421" y="146" text-anchor="middle" class="det">browse events</text>
    <text x="421" y="160" text-anchor="middle" class="det">join / leave groups</text>
    <text x="421" y="172" text-anchor="middle" class="det">register for events</text>
  </g>
  <line x1="488" y1="143" x2="508" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="510" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="575" y="130" text-anchor="middle" class="card">/community</text>
    <text x="575" y="146" text-anchor="middle" class="det">discussions + replies</text>
    <text x="575" y="160" text-anchor="middle" class="det">lazy-load a thread</text>
    <text x="575" y="172" text-anchor="middle" class="det">?discussion= deep link</text>
  </g>
  <line x1="642" y1="143" x2="662" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="664" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="729" y="130" text-anchor="middle" class="card">/career</text>
    <text x="729" y="146" text-anchor="middle" class="det">opportunities</text>
    <text x="729" y="160" text-anchor="middle" class="det">apply / withdraw</text>
    <text x="729" y="172" text-anchor="middle" class="det">interview prep</text>
  </g>
  <line x1="796" y1="143" x2="816" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="818" y="110" width="130" height="66" rx="8" fill="#FFF7ED" stroke="#F07C00" stroke-width="1.5"/>
    <text x="883" y="130" text-anchor="middle" class="card">/campus</text>
    <text x="883" y="146" text-anchor="middle" class="det">book resources</text>
    <text x="883" y="160" text-anchor="middle" class="det">manage bookings</text>
    <text x="883" y="172" text-anchor="middle" class="det">file service tickets</text>
  </g>
  <line x1="950" y1="143" x2="970" y2="143" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a5)"/>

  <g>
    <rect x="972" y="110" width="158" height="66" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="1051" y="130" text-anchor="middle" class="card" fill="#4338ca">/ai</text>
    <text x="1051" y="146" text-anchor="middle" class="det">streaming assistant</text>
    <text x="1051" y="160" text-anchor="middle" class="det">on-device LLM</text>
    <text x="1051" y="172" text-anchor="middle" class="det">Stop mid-stream</text>
  </g>

  <!-- SECONDARY -->
  <text x="48" y="212" class="det">Supporting surfaces: </text>
  <rect x="176" y="196" width="118" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="235" y="213" text-anchor="middle" class="det">/research</text>
  <rect x="302" y="196" width="140" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="372" y="213" text-anchor="middle" class="det">/notifications</text>
  <rect x="450" y="196" width="112" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="506" y="213" text-anchor="middle" class="det">/profile</text>
  <text x="580" y="212" class="det">— People directory, research-interest matching, optimistic mark-as-read, editable profile + privacy controls</text>

  <!-- ORGANISER -->
  <rect x="30" y="272" width="550" height="140" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="294" class="lane" fill="#7c3aed">ORGANISER — create and run campus content</text>

  <rect x="48" y="306" width="250" height="94" rx="8" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="173" y="324" text-anchor="middle" class="card">/organiser routes · 10 endpoints</text>
  <text x="60" y="342" class="det">• list own events + per-event analytics</text>
  <text x="60" y="356" class="det">• registration roster · waitlist promotion</text>
  <text x="60" y="370" class="det">• open a check-in session at the door</text>
  <text x="60" y="384" class="det">• review &amp; update opportunity applications</text>

  <rect x="312" y="306" width="252" height="94" rx="8" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="438" y="324" text-anchor="middle" class="card">Creator routes · 13 endpoints</text>
  <text x="324" y="342" class="det">• create/update events, clubs, opportunities</text>
  <text x="324" y="356" class="det">• club activities and project tracking</text>
  <text x="324" y="370" class="det">• close or archive — never hard-delete</text>
  <text x="324" y="384" class="det">• maintain service FAQs (staff work)</text>

  <!-- ADMIN -->
  <rect x="600" y="272" width="550" height="140" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="618" y="294" class="lane" fill="#b91c1c">ADMIN — governance, analytics &amp; the service desk</text>

  <g>
    <rect x="618" y="306" width="124" height="94" rx="8" fill="#FEF2F2" stroke="#F87171"/>
    <text x="680" y="324" text-anchor="middle" class="card">/admin/users</text>
    <text x="680" y="342" text-anchor="middle" class="det">member list</text>
    <text x="680" y="356" text-anchor="middle" class="det">role · status</text>
    <text x="680" y="370" text-anchor="middle" class="det">responsive table</text>
  </g>
  <g>
    <rect x="754" y="306" width="124" height="94" rx="8" fill="#FEF2F2" stroke="#F87171"/>
    <text x="816" y="324" text-anchor="middle" class="card">/admin/approvals</text>
    <text x="816" y="342" text-anchor="middle" class="det">club verification</text>
    <text x="816" y="356" text-anchor="middle" class="det">approve / reject</text>
    <text x="816" y="370" text-anchor="middle" class="det">removes on decide</text>
  </g>
  <g>
    <rect x="890" y="306" width="124" height="94" rx="8" fill="#FEF2F2" stroke="#F87171"/>
    <text x="952" y="324" text-anchor="middle" class="card">/admin/analytics</text>
    <text x="952" y="342" text-anchor="middle" class="det">30-day window</text>
    <text x="952" y="356" text-anchor="middle" class="det">period-over-period</text>
    <text x="952" y="370" text-anchor="middle" class="det">events by category</text>
  </g>
  <g>
    <rect x="1026" y="306" width="106" height="94" rx="8" fill="#FEF2F2" stroke="#F87171"/>
    <text x="1079" y="324" text-anchor="middle" class="card">/admin/ops</text>
    <text x="1079" y="342" text-anchor="middle" class="det">ticket queue</text>
    <text x="1079" y="356" text-anchor="middle" class="det">start / resolve</text>
    <text x="1079" y="370" text-anchor="middle" class="det">note required</text>
  </g>

  <!-- SERVICE DESK LOOP -->
  <rect x="30" y="428" width="1120" height="104" rx="11" fill="#0F172A"/>
  <text x="48" y="450" font-size="12" font-weight="700" fill="#FED7AA">THE DIFFERENTIATOR — a closed-loop service desk with SLA tracking</text>

  <rect x="48" y="462" width="160" height="54" rx="8" fill="#1E293B" stroke="#F07C00"/>
  <text x="128" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#FED7AA">Member files ticket</text>
  <text x="128" y="502" text-anchor="middle" font-size="9.5" fill="#94a3b8">POST /service-requests</text>

  <line x1="210" y1="489" x2="248" y2="489" stroke="#F07C00" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="250" y="462" width="176" height="54" rx="8" fill="#1E293B" stroke="#F07C00"/>
  <text x="338" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#FED7AA">Full message timeline</text>
  <text x="338" y="502" text-anchor="middle" font-size="9.5" fill="#94a3b8">service_request_events · SLA</text>

  <line x1="428" y1="489" x2="466" y2="489" stroke="#F07C00" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="468" y="462" width="176" height="54" rx="8" fill="#1E293B" stroke="#DC2626"/>
  <text x="556" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#FECACA">Staff console queue</text>
  <text x="556" y="502" text-anchor="middle" font-size="9.5" fill="#94a3b8">FOR UPDATE · no double-claim</text>

  <line x1="646" y1="489" x2="684" y2="489" stroke="#F07C00" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="686" y="462" width="160" height="54" rx="8" fill="#1E293B" stroke="#F07C00"/>
  <text x="766" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#FED7AA">Resolve + note</text>
  <text x="766" y="502" text-anchor="middle" font-size="9.5" fill="#94a3b8">note is mandatory</text>

  <line x1="848" y1="489" x2="886" y2="489" stroke="#F07C00" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="888" y="462" width="160" height="54" rx="8" fill="#1E293B" stroke="#22C55E"/>
  <text x="968" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#BBF7D0">Member rates it</text>
  <text x="968" y="502" text-anchor="middle" font-size="9.5" fill="#94a3b8">queue-stats → analytics</text>

  <text x="1058" y="484" text-anchor="middle" font-size="9.5" fill="#94a3b8">every state change</text>
  <text x="1058" y="498" text-anchor="middle" font-size="9.5" fill="#94a3b8">is written to</text>
  <text x="1058" y="512" text-anchor="middle" font-size="9.5" fill="#64748b">audit_logs</text>
</svg>