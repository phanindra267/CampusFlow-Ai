<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <style>
      .h { font-size:12px; font-weight:700; fill:#f1f5f9; }
      .d { font-size:10px; fill:#94a3b8; }
      .tt { font-size:19px; font-weight:700; fill:#f8fafc; }
      .pill { font-size:9.5px; font-weight:700; fill:#0f172a; }
      .lbl { font-size:9px; font-weight:700; fill:#a78bfa; }
    </style>
  </defs>

  <rect width="1000" height="640" fill="url(#bg5)"/>
  <text x="500" y="34" text-anchor="middle" class="tt">Hybrid AI Architecture — Deterministic Routing, Hybrid Retrieval, On-Device Generation</text>
  <text x="500" y="54" text-anchor="middle" class="d">Most requests never touch a model. Structured operations and search are answered from PostgreSQL; only complex reasoning runs WebLLM on WebGPU.</text>

  <!-- PRIVACY BANNER -->
  <rect x="30" y="70" width="940" height="46" rx="9" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
  <text x="500" y="89" text-anchor="middle" font-size="11.5" font-weight="700" fill="#D1FAE5">Campus data retrieval: Browser → Go API → PostgreSQL / Weaviate.   Generative inference: Browser → WebLLM → WebGPU.</text>
  <text x="500" y="107" text-anchor="middle" font-size="9.5" fill="#6EE7B7">Prompts are never sent to any external model provider. Retrieval still traverses the backend, so campus data is not purely client-side.</text>

  <!-- REQUEST -->
  <rect x="30" y="134" width="150" height="52" rx="9" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="105" y="156" text-anchor="middle" class="h">AI Request</text>
  <text x="105" y="172" text-anchor="middle" class="d">/ai page</text>

  <line x1="180" y1="160" x2="222" y2="160" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#a5)"/>

  <!-- ROUTER -->
  <rect x="222" y="134" width="196" height="52" rx="9" fill="#1E293B" stroke="url(#gai)" stroke-width="2"/>
  <text x="320" y="156" text-anchor="middle" class="h">Deterministic Intent Router</text>
  <text x="320" y="172" text-anchor="middle" class="d">regex + keyword + phrase · no LLM</text>

  <!-- three lanes -->
  <line x1="418" y1="160" x2="456" y2="160" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#a5)"/>

  <text x="470" y="128" class="lbl">STRUCTURED</text>
  <rect x="456" y="134" width="164" height="44" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1.8"/>
  <text x="538" y="152" text-anchor="middle" class="h" fill="#BBF7D0">Structured Action</text>
  <text x="538" y="167" text-anchor="middle" class="d">events · clubs · jobs</text>

  <text x="700" y="128" class="lbl">SEARCH</text>
  <rect x="640" y="134" width="164" height="44" rx="8" fill="#052E16" stroke="#22C55E" stroke-width="1.8"/>
  <text x="722" y="152" text-anchor="middle" class="h" fill="#BBF7D0">Search Query</text>
  <text x="722" y="167" text-anchor="middle" class="d">free text → hybrid</text>

  <text x="930" y="128" class="lbl">COMPLEX</text>
  <rect x="856" y="134" width="114" height="44" rx="8" fill="#431407" stroke="#F07C00" stroke-width="1.8"/>
  <text x="913" y="152" text-anchor="middle" class="h" fill="#FED7AA">Complex Query</text>
  <text x="913" y="167" text-anchor="middle" class="d">reasoning</text>

  <!-- structured lane -->
  <line x1="538" y1="178" x2="538" y2="206" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a5)"/>
  <rect x="456" y="206" width="164" height="52" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="538" y="226" text-anchor="middle" class="h">Existing REST Handlers</text>
  <text x="538" y="241" text-anchor="middle" class="d">Go services + repositories</text>
  <text x="538" y="253" text-anchor="middle" class="d">auth, RBAC, audit</text>

  <!-- search lane -->
  <line x1="722" y1="178" x2="722" y2="206" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a5)"/>
  <rect x="640" y="206" width="164" height="52" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="722" y="226" text-anchor="middle" class="h">Hybrid Retrieval</text>
  <text x="722" y="241" text-anchor="middle" class="d">BM25 ⊕ vector → RRF</text>
  <text x="722" y="253" text-anchor="middle" class="d">GET /api/v1/ai/context</text>

  <!-- complex lane -->
  <line x1="913" y1="178" x2="913" y2="320" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a5)"/>
  <rect x="856" y="320" width="114" height="52" rx="8" fill="#1E293B" stroke="#F07C00" stroke-width="1.5"/>
  <text x="913" y="340" text-anchor="middle" class="h" fill="#FED7AA">WebLLM Worker</text>
  <text x="913" y="355" text-anchor="middle" class="d">WebGPU · streamed</text>
  <text x="913" y="367" text-anchor="middle" class="d">off main thread</text>

  <!-- DB -->
  <rect x="456" y="278" width="164" height="52" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="538" y="298" text-anchor="middle" class="h">PostgreSQL</text>
  <text x="538" y="313" text-anchor="middle" class="d">events · clubs · opportunities</text>
  <text x="538" y="325" text-anchor="middle" class="d">resources · people · requests</text>
  <line x1="538" y1="258" x2="538" y2="278" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a5)"/>

  <!-- RAG / context -->
  <rect x="640" y="278" width="164" height="94" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.8"/>
  <text x="722" y="298" text-anchor="middle" class="h" fill="#7DD3FC">RAGService</text>
  <text x="722" y="314" text-anchor="middle" class="d">RetrieveDocuments()</text>
  <text x="722" y="329" text-anchor="middle" class="d">BM25 lexical arm</text>
  <text x="722" y="342" text-anchor="middle" class="d">Weaviate vector arm</text>
  <text x="722" y="356" text-anchor="middle" class="d">reciprocal-rank fusion</text>
  <text x="722" y="368" text-anchor="middle" class="d">BuildContext()</text>
  <line x1="722" y1="258" x2="722" y2="278" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a5)"/>

  <!-- retrieved context feeds generation -->
  <path d="M804,310 L840,310 L840,300 L856,300" fill="none" stroke="#7DD3FC" stroke-width="1.6" marker-end="url(#a5)"/>
  <text x="828" y="292" text-anchor="middle" font-size="8.5" fill="#7DD3FC">grounding</text>

  <!-- retrieval corpora -->
  <rect x="30" y="278" width="196" height="94" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="128" y="298" text-anchor="middle" class="h" fill="#7DD3FC">Retrieval Corpora</text>
  <text x="128" y="314" text-anchor="middle" class="d">tsvector + trigram indexes</text>
  <text x="128" y="328" text-anchor="middle" class="d">Weaviate DocumentChunk</text>
  <text x="128" y="342" text-anchor="middle" class="d">corpus cached 5 min</text>
  <text x="128" y="360" text-anchor="middle" class="d">vector arm optional —</text>
  <text x="128" y="370" text-anchor="middle" class="d">BM25 works alone</text>

  <!-- merge -->
  <rect x="30" y="396" width="940" height="66" rx="9" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="500" y="418" text-anchor="middle" class="h">Final Response — retrieval answers render as factual record lists; only the complex lane produces generated prose</text>
  <text x="500" y="437" text-anchor="middle" class="d">Every generated reply is grounded in retrieved records. When retrieval returns nothing, the assistant states the information is unavailable.</text>
  <text x="500" y="452" text-anchor="middle" class="d">Streaming: worker token deltas → React state → chat UI. Cancellation aborts the in-flight request without discarding output already produced.</text>

  <!-- guardrails -->
  <rect x="30" y="482" width="460" height="126" rx="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="260" y="504" text-anchor="middle" class="h" fill="#FDE68A">Honesty Guardrails</text>
  <text x="260" y="524" text-anchor="middle" class="d">No invented events, deadlines, seat counts, rankings,</text>
  <text x="260" y="539" text-anchor="middle" class="d">placements, attendance, marks or organisers.</text>
  <text x="260" y="558" text-anchor="middle" class="d">Empty retrieval → explicit "not available in CampusCare",</text>
  <text x="260" y="573" text-anchor="middle" class="d">naming the page the member should check.</text>
  <text x="260" y="593" text-anchor="middle" class="d">Vector results are dropped unless they match a real</text>
  <text x="260" y="603" text-anchor="middle" class="d">campus record, so the model cannot cite phantom entries.</text>

  <!-- lifecycle -->
  <rect x="510" y="482" width="460" height="126" rx="9" fill="#1E293B" stroke="#22C55E" stroke-width="1.5"/>
  <text x="740" y="504" text-anchor="middle" class="h" fill="#BBF7D0">Model Lifecycle &amp; Capability Handling</text>
  <text x="740" y="524" text-anchor="middle" class="d">Nothing loads at startup. WebGPU is probed first; weights</text>
  <text x="740" y="539" text-anchor="middle" class="d">download only on the first generative request.</text>
  <text x="740" y="558" text-anchor="middle" class="d">One engine is reused for the page lifetime, so repeated</text>
  <text x="740" y="573" text-anchor="middle" class="d">questions never re-initialise the model.</text>
  <text x="740" y="593" text-anchor="middle" class="d">Without WebGPU: no fallback, no external API — search and</text>
  <text x="740" y="603" text-anchor="middle" class="d">campus services keep working and a banner explains why.</text>
</svg>